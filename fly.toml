# fly.toml app configuration file generated for gold-link on 2026-11-26T20:41:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gold-link'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
